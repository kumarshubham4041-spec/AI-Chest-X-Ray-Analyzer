<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chest X-Ray Analyzer - Upload</title>
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 60px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
        }

        .upload-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            max-width: 500px;
            width: 100%;
            padding: 40px;
            text-align: center;
            box-sizing: border-box;
        }

        .upload-card h1 {
            font-size: 1.85rem;
            font-weight: 700;
            margin: 0 0 8px 0;
            color: var(--text-main);
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 28px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 24px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-weight: 500;
            font-size: 0.9rem;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        /* Style file input */
        input[type="file"] {
            width: 100%;
            padding: 12px;
            border: 1px dashed var(--border-color);
            border-radius: 8px;
            background-color: #f1f5f9;
            box-sizing: border-box;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        input[type="file"]::file-selector-button {
            padding: 8px 14px;
            border: none;
            background: #e2e8f0;
            border-radius: 6px;
            font-weight: 500;
            cursor: pointer;
            margin-right: 12px;
            transition: background 0.2s;
        }

        input[type="file"]::file-selector-button:hover {
            background: #cbd5e1;
        }

        .btn-submit {
            display: block;
            width: 100%;
            padding: 13px;
            background-color: var(--primary);
            color: white;
            font-size: 1rem;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2);
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 10px -1px rgba(37, 99, 235, 0.3);
        }

        .alert-error {
            background-color: #fee2e2;
            color: #b91c1c;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            margin-bottom: 20px;
            text-align: left;
        }
    </style>
</head>
<body>

    <div class="upload-card">
        <h1>AI Chest X-Ray Analyzer</h1>
        <p class="subtitle">Upload a chest radiograph to generate diagnostic predictions.</p>

        {% if messages %}
            {% for message in messages %}
                <div class="alert-error">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="form-group">
                {{ form.as_p }}
            </div>
            <button type="submit" class="btn-submit">Run Analysis</button>
        </form>
    </div>

</body>
</html>
